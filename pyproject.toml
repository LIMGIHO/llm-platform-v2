[project]
name = "llm-platform-v2"
version = "0.1.0"
description = "메르 페르소나 RAG QA 플랫폼 v2 (LlamaIndex + LM Studio)"
requires-python = ">=3.12"
dependencies = [
    # core framework
    "fastapi>=0.115.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # llama-index
    "llama-index>=0.11.0",
    "llama-index-llms-openai-like>=0.2.0",
    "llama-index-embeddings-openai>=0.2.0",
    "llama-index-vector-stores-qdrant>=0.3.0",
    "llama-index-retrievers-bm25>=0.3.0",
    # vector store & db
    "qdrant-client>=1.11.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    # cache
    "redis[hiredis]>=5.1.0",
    # korean tokenizer (batch BM25 build + app BM25 query)
    "kiwipiepy>=0.19.0",
    # observability
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "psycopg2-binary>=2.9.12",
]

[dependency-groups]
app = [
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
]
batch = [
    "typer>=0.12.0",
    "apscheduler>=3.10.0",
    "tqdm>=4.66.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["app", "batch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


