name: mer-infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: mer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llm-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-llm-platform}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../infra/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llm-platform} -d ${POSTGRES_DB:-llm-platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mer-net

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: mer-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mer-net

  redis:
    image: redis:7-alpine
    container_name: mer-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mer-net

volumes:
  pg_data:
  qdrant_data:
  redis_data:

networks:
  mer-net:
    name: mer-net
    driver: bridge
