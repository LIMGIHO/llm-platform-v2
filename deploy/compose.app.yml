name: mer-app

services:
  # tei-reranker:
  #   image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
  #   platform: linux/amd64   # ARM Mac — Rosetta 에뮬레이션
  #   container_name: mer-tei-reranker
  #   restart: unless-stopped
  #   command: --model-id BAAI/bge-reranker-v2-m3 --port 8080
  #   volumes:
  #     - tei_cache:/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 10
  #     start_period: 120s
  #   networks:
  #     - mer-net

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
      target: runtime
      args:
        - GIT_SHA=${GIT_SHA:-local}
    image: mer-app:${GIT_SHA:-local}
    container_name: mer-app
    restart: unless-stopped
    env_file:
      - env/.env
    environment:
      - GIT_SHA=${GIT_SHA:-local}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - /mnt/c/Source/mer-v2/data/bm25:/data/bm25:ro
      - hf_cache:/root/.cache/huggingface
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "postgres:192.168.219.105"
      - "qdrant:192.168.219.105"
      - "redis:192.168.219.105"
      # depends_on:
      # tei-reranker:
      #   condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8000/healthz || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - mer-net

volumes:
  hf_cache:
    # tei_cache:

networks:
  mer-net:
    external: true
